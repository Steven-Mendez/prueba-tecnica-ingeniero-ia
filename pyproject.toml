[project]
name = "prueba-tecnica-casa-pellas"
version = "0.1.0"
description = "Prueba técnica Ingeniero de IA: sistema de pedidos a fábrica y diagnóstico de renovaciones"
readme = "README.md"
authors = [
    { name = "Steven Mendez", email = "stevenampaiz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = false  # no se empaqueta: la API vive en app/ y el análisis en los notebooks

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.17.3",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# El formatter controla el largo de línea; los textos largos en f-strings/Markdown no se pueden partir.
ignore = ["E501"]
